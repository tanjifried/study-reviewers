const LESSONS=[{"id": "lesson-1", "file": "AUTHENTICATION.pptx", "title": "Authentication and Hash Functions", "subtitle": "Identity, message digests, and SHA-1", "concepts": [{"term": "Authentication", "definition": "The process of verifying identity; it can validate identity documents or ensure that a product or document is not forged.", "slide": 2, "falsehood": "Authentication means granting permissions without checking any identity."}, {"term": "Historical wax seal", "definition": "A wax seal bonds to paper, parchment, ribbons, wire, or other material and is difficult to separate without noticeable tampering.", "slide": 3, "falsehood": "A wax seal mathematically proves that no forgery is possible."}, {"term": "Tamper evidence", "definition": "A wax bond is difficult to separate without noticeable tampering; wax can verify that a document is unopened.", "slide": 4, "falsehood": "A wax seal guarantees that no attacker can imitate or replace it."}, {"term": "Hash function", "definition": "A function that maps data of any size to fixed-size values.", "slide": 5, "falsehood": "A fixed hash algorithm must produce longer digests for longer messages."}, {"term": "Message digest", "definition": "The values returned by a hash function are called hash values, hash codes, digests, or hashes.", "slide": 5, "falsehood": "A message digest is necessarily the original plaintext in readable form."}, {"term": "Hashing and encryption", "definition": "Hashing produces a digest; encryption uses a key and is designed to be reversed by authorized parties.", "slide": 5, "falsehood": "Hashing and encryption are identical reversible operations."}, {"term": "Early hashing history", "definition": "Hans Peter Luhn's method aimed to speed up searching a telephone directory of over a million records.", "slide": 6, "falsehood": "The slides describe early hashing as having no use in searching records."}, {"term": "Hash bucket", "definition": "Luhn's method put related information in a single “bucket” to speed up searching.", "slide": 6, "falsehood": "A hash bucket is a certificate that proves a sender's identity."}, {"term": "MD4 and MD5", "definition": "MD4 (Message Digest 4) and MD5 (Message Digest 5) are hash algorithms named on the slide.", "slide": 7, "falsehood": "MD4 and MD5 are encryption algorithms rather than hash algorithms."}, {"term": "SHA-1", "definition": "SHA-1 (Secure Hash Algorithm 1) uses 80 rounds and has a hash value of 160 bits.", "slide": 16, "falsehood": "SHA-1 produces a 512-bit digest and performs only one round."}, {"term": "SHA-2 and SHA-3", "definition": "The slide names SHA-3 (512) among the latest and strongest hash algorithms at the time.", "slide": 7, "falsehood": "The slide names SHA-1 as the latest and strongest hash algorithm at the time."}, {"term": "Hash sensitivity", "definition": "The MD5 hash algorithm is case sensitive: the hash value differs when the same word or phrase uses lowercase and uppercase.", "slide": 8, "falsehood": "Changing letter case always leaves the hash value unchanged."}, {"term": "MD5 case example", "definition": "The slide's MD5 hash value for CCSICT (all caps) is afa10b1e77998a5806a8b0fdff622b03.", "slide": 9, "falsehood": "The slide gives a different MD5 hash value for CCSICT (all caps): 00000000000000000000000000000000."}, {"term": "MD5 output length", "definition": "Supplemental reference: MD5 produces a 128-bit digest, commonly displayed as 32 hexadecimal characters.", "slide": 10, "falsehood": "MD5's digest length grows in direct proportion to the input length."}, {"term": "Fixed-length digest", "definition": "A hash function maps data of any size to fixed-size values.", "slide": 11, "falsehood": "A longer message always makes the hash function return a longer value."}, {"term": "Input comparison exercise", "definition": "The MD5 hash value differs when the same word or phrase uses lowercase and uppercase.", "slide": 12, "falsehood": "The same hash algorithm must output identical hash values for uppercase and lowercase inputs."}, {"term": "Integrity check", "definition": "Supplemental: comparing a computed digest with a trusted expected digest can reveal changes to the message.", "slide": 12, "falsehood": "Comparing a digest against an untrusted replacement always proves the message was unchanged."}, {"term": "Authenticated integrity", "definition": "An HMAC or digital signature can protect message integrity and help authenticate the source when keys are managed correctly.", "slide": 12, "falsehood": "A plain unkeyed hash sent alongside a message by itself authenticates the sender against an active attacker."}, {"term": "MD4 meaning", "definition": "MD4 stands for Message Digest 4 and is an older hash algorithm.", "slide": 13, "falsehood": "MD4 is the name of a modern authentication factor rather than a hash algorithm."}, {"term": "SHA-1 digest size", "definition": "SHA-1 outputs 160 bits, equivalent to 20 bytes or 40 hexadecimal digits.", "slide": 16, "falsehood": "SHA-1 outputs 160 hexadecimal digits for every message."}, {"term": "SHA-1 block size", "definition": "SHA-1 processes padded messages in 512-bit blocks.", "slide": 17, "falsehood": "SHA-1 processes a padded block containing only five bits."}, {"term": "SHA-1 initial words", "definition": "SHA-1 starts with five 32-bit state words, often named H0 through H4 or A through E.", "slide": 17, "falsehood": "The initial SHA-1 state consists of one 512-bit word and no named working variables."}, {"term": "SHA-1 initial parsing", "definition": "A 512-bit message block is parsed into sixteen 32-bit words before the schedule is expanded.", "slide": 17, "falsehood": "A 512-bit SHA-1 block is initially parsed into sixteen 64-bit words."}, {"term": "SHA-1 padding", "definition": "Append a 1 bit, then zero bits, then the original message length encoded in 64 bits to reach a multiple of 512 bits.", "slide": 17, "falsehood": "SHA-1 padding consists only of zeros and never includes the original message length."}, {"term": "SHA-1 schedule expansion", "definition": "For t from 16 to 79, W[t] is a one-bit left rotation of W[t-3] XOR W[t-8] XOR W[t-14] XOR W[t-16].", "slide": 17, "falsehood": "SHA-1 expands W[t] using W[t-13] in place of W[t-3]."}, {"term": "SHA-1 round function", "definition": "The round function changes across four 20-round ranges; the first uses (B AND C) OR ((NOT B) AND D).", "slide": 17, "falsehood": "The first SHA-1 round function omits NOT B from its second term."}, {"term": "SHA-1 constants", "definition": "Each of four SHA-1 round ranges uses a specified constant, beginning with 5a827999 for rounds 0–19.", "slide": 17, "falsehood": "Every SHA-1 round uses the same constant regardless of its range."}, {"term": "SHA-1 schedule note", "definition": "The lecture's printed schedule and first-round function contain typos; use the standard formulas in the explanation.", "slide": 17, "falsehood": "Every formula and range printed on the lecture's SHA-1 properties slide is error-free."}, {"term": "SHA-1 worked message", "definition": "The sample hexadecimal message 1a7fd53b4c is five bytes, or 40 bits long.", "slide": 18, "falsehood": "The hexadecimal message 1a7fd53b4c contains 128 bits."}, {"term": "SHA-1 padded sample", "definition": "For the sample message, W0 is 1a7fd53b, W1 begins 4c800000, and the final length word is 00000028.", "slide": 18, "falsehood": "The sample's encoded length word 00000028 represents 28 decimal bits."}, {"term": "SHA-1 state update", "definition": "In the first round, the old A becomes new B and rotating the old B left by 30 bits gives new C.", "slide": 19, "falsehood": "In a SHA-1 round, the previous A is discarded without affecting any new state word."}, {"term": "32-bit left rotation", "definition": "A rotate-left moves bits around a fixed 32-bit word, wrapping the bits that leave the left end back to the right.", "slide": 20, "falsehood": "A 32-bit rotate-left permanently discards all bits shifted out of the word."}, { const app=document.getElementById('app');
const KEY='information-assurance-quiz-v1', HISTORY_KEY='information-assurance-quiz-history-v1';
let history={};try{history=JSON.parse(localStorage.getItem(HISTORY_KEY)||'{}');if(!history||typeof history!=='object'||Array.isArray(history))history={}}catch(e){history={}}
let saved={}, storageOK=true, active=null, index=0, review=false;

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const getLesson=id=>LESSONS.find(l=>l.id===id);

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved));localStorage.setItem(HISTORY_KEY,JSON.stringify(history))}catch(e){storageOK=false}}
function attemptId(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,11)}
function recordCompleted(key){const s=saved[key];if(!valid(s))return;const st=stats(s);if(key==='final'&&s.feedback===false&&!s.submitted)return;if(st.answered!==st.total&&!(key==='final'&&s.feedback===false&&s.submitted))return;if(!s.attemptId)s.attemptId=attemptId();if(!Array.isArray(history[key]))history[key]=[];if(!history[key].some(x=>x.id===s.attemptId))history[key].push({id:s.attemptId,correct:st.correct,total:st.total,completedAt:new Date().toISOString()});persist()}
function selectedQuestions(l){return l.questions.filter((q,i)=>q.kind==='mc'||(q.kind==='tf'&&Math.floor(i/2)%3===0))}
function historyText(key){const h=Array.isArray(history[key])?history[key]:[];if(!h.length)return '';const latest=h[h.length-1],best=h.reduce((a,b)=>b.correct/b.total>a.correct/a.total?b:a);return `${h.length} completed attempt${h.length===1?'':'s'} · Latest ${latest.correct}/${latest.total} (${Math.round(latest.correct/latest.total*100)}%) · Best ${Math.round(best.correct/best.total*100)}%`}
function stats(s){const qs=s.ids.map(id=>lookup[id]);const answered=qs.filter(q=>Number.isInteger(s.answers[q.id]));return {total:qs.length,answered:answered.length,correct:answered.filter(q=>s.answers[q.id]===q.answer).length}}

function courseStats(){const total=LESSONS.reduce((n,l)=>n+(valid(saved[l.id])?stats(saved[l.id]).total:selectedQuestions(l).length),0);let answered=0;LESSONS.forEach(l=>{if(valid(saved[l.id]))answered+=stats(saved[l.id]).answered});return `${answered} / ${total} lesson questions answered`}
function label(key){const s=saved[key];if(!valid(s))return 'Start quiz';return (s.feedback===false&&!s.submitted)?'Continue exam':(stats(s).answered===s.ids.length||s.submitted)?'View results':'Continue quiz'}
function dashboard(){active=null;review=false;const concepts=LESSONS.reduce((n,l)=>n+l.concepts.length,0);app.innerHTML=`<div class="intro-grid"><section><h1>Learn it. Test it. Understand it.</h1><p class="intro">Work through each lesson at your own pace. Every answer reveals the correct choice, an explanation, and the source slide.</p><p class="quiet">${LESSONS.length} lessons · ${concepts} concepts · ${LESSONS.reduce((n,l)=>n+selectedQuestions(l).length,0)} practice questions<br>Multiple choice and true or false in every lesson.</p></section><section class="exam"><h2>Final exam</h2><p>Choose up to ${concepts} questions across all ${LESSONS.length} lessons, with one question per concept. Choose whether feedback appears after each answer or after submission.</p><div class="actions"><button class="btn" data-setup>Set up final exam</button>${valid(saved.final)?`<button class="btn secondary" data-final-resume>${label('final')}</button>`:''}</div>${valid(saved.final)?`<p class="quiet" style="color:#dfebdf;margin:16px 0 0">${stats(saved.final).answered} / ${stats(saved.final).total} answered</p>`:''}</section></div><div class="section-head"><h2>Your lessons</h2><span class="quiet">${courseStats()}</span></div>${LESSONS.map((l,i)=>{const s=saved[l.id],st=valid(s)?stats(s):null;return `<article class="lesson-row"><div class="num">${i+1}</div><div><h3>${esc(l.title)}</h3><p>${esc(l.subtitle)}</p><p>${l.concepts.length} concepts · ${l.concepts.length} multiple choice · ${selectedQuestions(l).filter(q=>q.kind==='tf').length} true/false <a class="source" href="${lectureSource(l)}">Read lesson</a></p>${st?`<p>${st.answered}/${st.total} answered · ${st.correct} correct${st.answered===st.total?' · '+Math.round(st.correct/st.total*100)+'%':''}</p>`:''}${historyText(l.id)?`<p>${historyText(l.id)}</p>`:''}${st&&st.total!==selectedQuestions(l).length?'<p>Earlier attempt: original question count. A new attempt uses fewer true/false questions.</p>':''}</div><button class="btn secondary" data-start="${l.id}">${label(l.id)}</button></article>`}).join('')}<p class="save-note">Progress saves in this browser when local storage is available. Completed scores and current attempts stay in this browser, including when you start again. ${storageOK?'':'Storage is unavailable; keep this tab open to preserve this session.'}</p>`;app.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start));app.querySelector('[data-setup]').onclick=setupFinal;const resumeFinal=app.querySelector('[data-final-resume]');if(resumeFinal)resumeFinal.onclick=()=>start('final');window.scrollTo(0,0)}
function makeIds(key,count){if(key!=='final')return shuffle(selectedQuestions(getLesson(key)).map(q=>q.id));let n=0;const groups=shuffle(LESSONS.map(l=>shuffle(l.concepts.map((c,i)=>l.questions[i*2+(n++%2)].id))));const pool=[];while(groups.some(g=>g.length))for(const g of groups)if(g.length)pool.push(g.pop());return shuffle(pool.slice(0,count||pool.length))}
function setupFinal(){active=null;const max=LESSONS.reduce((n,l)=>n+l.concepts.length,0),previous=valid(saved.final)?saved.final:null,count=previous&&Number.isInteger(previous.count)?previous.count:max,feedback=previous?previous.feedback!==false:true;app.innerHTML=`<div class="quiz-shell"><h1>Final exam setup</h1><p class="intro">Choose the number of questions and when to see feedback. Your existing attempt stays saved until you start a new one.</p><form id="exam-setup" class="summary"><label class="setup-field">Number of questions (1–${max})<input id="final-count" type="number" min="1" max="${max}" step="1" required value="${count}"></label><label class="setup-field"><input id="final-instant" type="checkbox" ${feedback?'checked':''}>Show feedback after each answer</label><div class="actions"><button class="btn" id="final-start" type="submit">Start exam</button>${previous?'<button class="btn secondary" type="button" id="final-resume">Resume existing attempt</button>':''}<button class="home" type="button" id="cancel-setup">All lessons</button></div></form></div>`;document.getElementById('exam-setup').onsubmit=e=>{e.preventDefault();const count=Number(document.getElementById('final-count').value);if(!Number.isInteger(count)||count<1||count>max)return;const show=document.getElementById('final-instant').checked;recordCompleted('final');saved.final={ids:makeIds('final',count),answers:{},position:0,attemptId:attemptId(),count,feedback:show,submitted:false};persist();start('final')};const resume=document.getElementById('final-resume');if(resume)resume.onclick=()=>start('final');document.getElementById('cancel-setup').onclick=dashboard;window.scrollTo(0,0)}
function start(key,fresh=false){active=key;review=false;if(key==='final'&&!valid(saved.final)){setupFinal();return}if(fresh||!valid(saved[key])){if(fresh)recordCompleted(key);saved[key]={ids:makeIds(key),answers:{},position:0,attemptId:attemptId()};persist()}const s=saved[key];index=Number.isInteger(s.position)?Math.min(Math.max(0,s.position),s.ids.length-1):0;const deferred=key==='final'&&s.feedback===false;if(s.submitted||(!deferred&&stats(s).answered===s.ids.length))results();else{if(!deferred){const first=s.ids.findIndex(id=>!Number.isInteger(s.answers[id]));if(Number.isInteger(s.answers[s.ids[index]]))index=first}renderQuestion()}window.scrollTo(0,0)}
function renderQuestion(){const s=saved[active],st=stats(s),q=lookup[s.ids[index]],l=getLesson(q.lesson),chosen=s.answers[q.id],answered=Number.isInteger(chosen),deferred=active==='final'&&s.feedback===false&&!s.submitted,reveal=!deferred,locked=answered&&reveal;s.position=index;persist();app.innerHTML=`<div class="quiz-shell"><div class="quiz-head"><div><h1>${active==='final'?'Final exam':esc(l.title)}</h1><div class="quiet">${active==='final'?esc(l.title)+' · ':''}${esc(l.subtitle)}</div></div><div class="quiet">${deferred?st.answered+' answered':st.correct+' correct / '+st.answered+' answered'}</div></div><div class="progress" role="progressbar" aria-label="Answered questions" aria-valuenow="${st.answered}" aria-valuemin="0" aria-valuemax="${st.total}"><span style="width:${st.answered/st.total*100}%"></span></div><div class="status"><span>Question ${index+1} of ${st.total}</span><span>${st.answered} answered · ${st.total-st.answered} remaining</span></div><section class="question" aria-labelledby="prompt"><div class="type">${q.kind==='mc'?'Multiple choice':'True or false'} · Choose one answer</div><h2 id="prompt">${esc(q.prompt)}</h2><div class="options">${q.options.map((o,i)=>`<button class="option ${deferred?(i===chosen?'selected':''):(answered||s.submitted)?(i===q.answer?'correct':i===chosen?'incorrect':''):''}" data-option="${i}" ${(locked||s.submitted)?'disabled':''}><span class="letter">${q.kind==='mc'?String.fromCharCode(65+i):i===0?'T':'F'}</span><span>${esc(o)}${reveal&&(answered||s.submitted)&&i===q.answer?'<span class="choice-label">Correct answer'+(chosen===i?' · Your choice':'')+'</span>':reveal&&answered&&i===chosen?'<span class="choice-label">Your choice · Incorrect</span>':''}</span></button>`).join('')}</div><div id="feedback" aria-live="polite" aria-atomic="true">${reveal&&(answered||s.submitted)?feedback(q,chosen):''}</div></section><div class="nav"><button class="btn secondary" id="prev" ${index===0?'disabled':''}>Previous</button><button clas app.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.option)));

function feedback(q,chosen){const l=getLesson(q.lesson);return `<div class="feedback ${chosen===q.answer?'':'wrong'}"><strong>${Number.isInteger(chosen)?(chosen===q.answer?'Correct.':'Incorrect.'):'Unanswered.'} Correct answer: ${esc(q.options[q.answer])}</strong><p>${esc(q.explanation)}</p>${chosen===q.answer?'<p class="quiet">Press Enter for the next question.</p>':''}<a href="${lectureSource(l)}#slide-${q.slide}">Review ${esc(l.title)} — slide ${q.slide}</a></div>`}
function answer(choice){const s=saved[active],q=lookup[s.ids[index]];if(Number.isInteger(s.answers[q.id])&&!(active==='final'&&s.feedback===false&&!s.submitted))return;s.answers[q.id]=choice;recordCompleted(active);persist();renderQuestion();if(!(active==='final'&&s.feedback===false&&!s.submitted)){const box=document.getElementById('feedback');box.setAttribute('tabindex','-1');box.focus({preventScroll:true})}}

function results(){if(active==='final'&&saved.final.feedback===false&&!saved.final.submitted){submitFinal();return}recordCompleted(active);const s=saved[active],st=stats(s),complete=st.answered===st.total||!!s.submitted,missed=s.ids.filter(id=>Number.isInteger(s.answers[id])&&s.answers[id]!==lookup[id].answer),pct=st.answered||s.submitted?Math.round(st.correct/(s.submitted?st.total:st.answered)*100):0;app.innerHTML=`<div class="quiz-shell"><h1>${complete?'Attempt complete': 'Your progress'}</h1><p class="intro">${active==='final'?'Final exam':esc(getLesson(active).title)} · ${st.answered} of ${st.total} answered</p><section class="summary"><div class="score">${st.correct} / ${complete?st.total:st.answered}</div><p>${s.submitted?pct+'% correct out of all questions.':st.answered?pct+'% correct on answered questions.':'No questions answered yet.'} ${!complete?`${st.total-st.answered} questions remain; this is a partial result.`:''}</p>${historyText(active)?`<p>${historyText(active)}</p>`:''}<div class="actions">${!complete?'<button class="btn" id="resume">Continue unanswered questions</button>':''}<button class="btn ${complete?'':'secondary'}" id="review">Review answers</button><button class="btn secondary" id="restart">Start a new attempt</button></div></section>${active==='final'?`<h2>By lesson</h2><table><thead><tr><th>Lesson</th><th>Correct / answered / total</th></tr></thead><tbody>${LESSONS.map(l=>{const ids=s.ids.filter(id=>lookup[id].lesson===l.id),a=ids.filter(id=>Number.isInteger(s.answers[id])),c=a.filter(id=>s.answers[id]===lookup[id].answer);return `<tr><td>${esc(l.title)}</td><td>${c.length} / ${a.length} / ${ids.length}</td></tr>`}).join('')}</tbody></table>`:''}<h2>${missed.length?'Revisit these concepts':'Review notes'}</h2><p class="quiet">${missed.length?missed.length+' incorrect answers. Use the slide references to revise.':complete?(st.answered<st.total?'Review your answers, including unanswered questions.':'You answered every question correctly. You can review your answers or begin a new attempt.'):'Your incorrect answers will appear here as you work.'}</p>${missed.map(id=>{const q=lookup[id];return `<div class="review-item"><h3>${esc(q.concept)}</h3><p>${esc(q.prompt)}</p><p class="quiet">Your answer: ${esc(q.options[s.answers[id]])}</p>${feedback(q,s.answers[id])}</div>`}).join('')}</div>`;
