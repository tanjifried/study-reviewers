const app=document.getElementById('app');
const KEY='information-assurance-quiz-v1', HISTORY_KEY='information-assurance-quiz-history-v1';
let history={};try{history=JSON.parse(localStorage.getItem(HISTORY_KEY)||'{}');if(!history||typeof history!=='object'||Array.isArray(history))history={}}catch(e){history={}}
let saved={}, storageOK=true, active=null, index=0, review=false;
try{saved=JSON.parse(localStorage.getItem(KEY)||'{}');if(!saved||typeof saved!=='object'||Array.isArray(saved))saved={}}catch(e){storageOK=false;saved={}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const all=LESSONS.flatMap(l=>l.questions), lookup=Object.fromEntries(all.map(q=>[q.id,q]));
const getLesson=id=>LESSONS.find(l=>l.id===id);
const lectureSource=l=>'lecture-'+l.id.replace('lesson-','')+'.html';
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved));localStorage.setItem(HISTORY_KEY,JSON.stringify(history))}catch(e){storageOK=false}}
function attemptId(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,11)}
function recordCompleted(key){const s=saved[key];if(!valid(s))return;const st=stats(s);if(st.answered!==st.total)return;if(!s.attemptId)s.attemptId=attemptId();if(!Array.isArray(history[key]))history[key]=[];if(!history[key].some(x=>x.id===s.attemptId))history[key].push({id:s.attemptId,correct:st.correct,total:st.total,completedAt:new Date().toISOString()});persist()}
function selectedQuestions(l){return l.questions.filter((q,i)=>q.kind==='mc'||(q.kind==='tf'&&Math.floor(i/2)%3===0))}
function historyText(key){const h=Array.isArray(history[key])?history[key]:[];if(!h.length)return '';const latest=h[h.length-1],best=h.reduce((a,b)=>b.correct/b.total>a.correct/a.total?b:a);return `${h.length} completed attempt${h.length===1?'':'s'} · Latest ${latest.correct}/${latest.total} (${Math.round(latest.correct/latest.total*100)}%) · Best ${Math.round(best.correct/best.total*100)}%`}
function stats(s){const qs=s.ids.map(id=>lookup[id]);const answered=qs.filter(q=>Number.isInteger(s.answers[q.id]));return {total:qs.length,answered:answered.length,correct:answered.filter(q=>s.answers[q.id]===q.answer).length}}
function valid(s){return s&&Array.isArray(s.ids)&&s.ids.length&&s.ids.every(id=>lookup[id])&&s.answers&&typeof s.answers==='object'}
for(const key of Object.keys(saved)){if(!valid(saved[key]))delete saved[key];else {if(!saved[key].attemptId)saved[key].attemptId=attemptId();recordCompleted(key)}}persist();
function courseStats(){const total=LESSONS.reduce((n,l)=>n+(valid(saved[l.id])?stats(saved[l.id]).total:selectedQuestions(l).length),0);let answered=0;LESSONS.forEach(l=>{if(valid(saved[l.id]))answered+=stats(saved[l.id]).answered});return `${answered} / ${total} lesson questions answered`}
function label(key){const s=saved[key];if(!valid(s))return 'Start quiz';return stats(s).answered===s.ids.length?'View results':'Continue quiz'}
function dashboard(){active=null;review=false;const concepts=LESSONS.reduce((n,l)=>n+l.concepts.length,0);app.innerHTML=`<div class="intro-grid"><section><h1>Learn it. Test it. Understand it.</h1><p class="intro">Work through each lesson at your own pace. Every answer reveals the correct choice, an explanation, and the source slide.</p><p class="quiet">${LESSONS.length} lessons · ${concepts} concepts · ${LESSONS.reduce((n,l)=>n+selectedQuestions(l).length,0)} practice questions<br>Multiple choice and true or false in every lesson.</p></section><section class="exam"><h2>Final exam</h2><p>${concepts} questions covering every concept across both lessons. One question per concept, with a mix of multiple choice and true or false. Immediate feedback stays on.</p><div class="actions"><button class="btn" data-start="final">${valid(saved.final)?label('final'):'Start final exam'}</button></div>${valid(saved.final)?`<p class="quiet" style="color:#dfebdf;margin:16px 0 0">${stats(saved.final).answered} / ${concepts} answered</p>`:''}</section></div><div class="section-head"><h2>Your lessons</h2><span class="quiet">${courseStats()}</span></div>${LESSONS.map((l,i)=>{const s=saved[l.id],st=valid(s)?stats(s):null;return `<article class="lesson-row"><div class="num">${i+1}</div><div><h3>${esc(l.title)}</h3><p>${esc(l.subtitle)}</p><p>${l.concepts.length} concepts · ${l.concepts.length} multiple choice · ${selectedQuestions(l).filter(q=>q.kind==='tf').length} true/false <a class="source" href="${lectureSource(l)}">Read lesson</a></p>${st?`<p>${st.answered}/${st.total} answered · ${st.correct} correct${st.answered===st.total?' · '+Math.round(st.correct/st.total*100)+'%':''}</p>`:''}${historyText(l.id)?`<p>${historyText(l.id)}</p>`:''}${st&&st.total!==selectedQuestions(l).length?'<p>Earlier attempt: original question count. A new attempt uses fewer true/false questions.</p>':''}</div><button class="btn secondary" data-start="${l.id}">${label(l.id)}</button></article>`}).join('')}<p class="save-note">Progress saves in this browser when local storage is available. Completed scores and current attempts stay in this browser, including when you start again. ${storageOK?'':'Storage is unavailable; keep this tab open to preserve this session.'}</p>`;app.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start));window.scrollTo(0,0)}
function makeIds(key){if(key!=='final')return shuffle(selectedQuestions(getLesson(key)).map(q=>q.id));let n=0;return shuffle(LESSONS.flatMap(l=>l.concepts.map((c,i)=>l.questions[i*2+(n++%2)].id)))}
function start(key,fresh=false){active=key;review=false;if(fresh||!valid(saved[key])){if(fresh)recordCompleted(key);saved[key]={ids:makeIds(key),answers:{},position:0,attemptId:attemptId()};persist()}const s=saved[key];index=Number.isInteger(s.position)?Math.min(Math.max(0,s.position),s.ids.length-1):0;if(stats(s).answered===s.ids.length)results();else{const first=s.ids.findIndex(id=>!Number.isInteger(s.answers[id]));if(Number.isInteger(s.answers[s.ids[index]]))index=first;renderQuestion()}window.scrollTo(0,0)}
function renderQuestion(){const s=saved[active],st=stats(s),q=lookup[s.ids[index]],l=getLesson(q.lesson),chosen=s.answers[q.id],answered=Number.isInteger(chosen);s.position=index;persist();app.innerHTML=`<div class="quiz-shell"><div class="quiz-head"><div><h1>${active==='final'?'Final exam':esc(l.title)}</h1><div class="quiet">${active==='final'?esc(l.title)+' · ':''}${esc(l.subtitle)}</div></div><div class="quiet">${st.correct} correct / ${st.answered} answered</div></div><div class="progress" role="progressbar" aria-label="Answered questions" aria-valuenow="${st.answered}" aria-valuemin="0" aria-valuemax="${st.total}"><span style="width:${st.answered/st.total*100}%"></span></div><div class="status"><span>Question ${index+1} of ${st.total}</span><span>${st.answered} answered · ${st.total-st.answered} remaining</span></div><section class="question" aria-labelledby="prompt"><div class="type">${q.kind==='mc'?'Multiple choice':'True or false'} · Choose one answer</div><h2 id="prompt">${esc(q.prompt)}</h2><div class="options">${q.options.map((o,i)=>`<button class="option ${answered?(i===q.answer?'correct':i===chosen?'incorrect':''):''}" data-option="${i}" ${answered?'disabled':''}><span class="letter">${q.kind==='mc'?String.fromCharCode(65+i):i===0?'T':'F'}</span><span>${esc(o)}${answered&&i===q.answer?'<span class="choice-label">Correct answer'+(chosen===i?' · Your choice':'')+'</span>':answered&&i===chosen?'<span class="choice-label">Your choice · Incorrect</span>':''}</span></button>`).join('')}</div><div id="feedback" aria-live="polite" aria-atomic="true">${answered?feedback(q,chosen):''}</div></section><div class="nav"><button class="btn secondary" id="prev" ${index===0?'disabled':''}>Previous</button><button class="home" id="finish">${st.answered===st.total?'View results':'Progress & results'}</button><button class="btn" id="next">${index===st.total-1?'View results':'Next question'}</button></div><details><summary>Jump to a question</summary><p class="quiet">Green: correct · peach: incorrect · white: unanswered</p><div class="jump">${s.ids.map((id,i)=>`<button class="${i===index?'current ':''}${Number.isInteger(s.answers[id])?(s.answers[id]===lookup[id].answer?'done':'miss'):''}" aria-label="Question ${i+1}${Number.isInteger(s.answers[id])?(s.answers[id]===lookup[id].answer?', correct':', incorrect'):', unanswered'}" ${i===index?'aria-current="step"':''} data-jump="${i}">${i+1}</button>`).join('')}</div></details><p class="save-note">Your first selection is scored and locked. Use “Start a new attempt” in results to try again.${storageOK?'':' Progress cannot be saved to this browser.'}</p></div>`;
app.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.option)));
app.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{index=Number(b.dataset.jump);renderQuestion();window.scrollTo(0,0)});
document.getElementById('prev').onclick=()=>{if(index>0){index--;renderQuestion();window.scrollTo(0,0)}};
document.getElementById('next').onclick=()=>{if(index<s.ids.length-1){index++;renderQuestion();window.scrollTo(0,0)}else results()};document.getElementById('finish').onclick=results}
function feedback(q,chosen){const l=getLesson(q.lesson);return `<div class="feedback ${chosen===q.answer?'':'wrong'}"><strong>${chosen===q.answer?'Correct.':'Incorrect.'} Correct answer: ${esc(q.options[q.answer])}</strong><p>${esc(q.explanation)}</p>${chosen===q.answer?'<p class="quiet">Press Enter for the next question.</p>':''}<a href="${lectureSource(l)}#slide-${q.slide}">Review ${esc(l.title)} — slide ${q.slide}</a></div>`}
function answer(choice){const s=saved[active],q=lookup[s.ids[index]];if(Number.isInteger(s.answers[q.id]))return;s.answers[q.id]=choice;recordCompleted(active);persist();renderQuestion();const box=document.getElementById('feedback');box.setAttribute('tabindex','-1');box.focus({preventScroll:true})}
function results(){recordCompleted(active);const s=saved[active],st=stats(s),complete=st.answered===st.total,missed=s.ids.filter(id=>Number.isInteger(s.answers[id])&&s.answers[id]!==lookup[id].answer),pct=st.answered?Math.round(st.correct/st.answered*100):0;app.innerHTML=`<div class="quiz-shell"><h1>${complete?'Attempt complete': 'Your progress'}</h1><p class="intro">${active==='final'?'Final exam':esc(getLesson(active).title)} · ${st.answered} of ${st.total} answered</p><section class="summary"><div class="score">${st.correct} / ${complete?st.total:st.answered}</div><p>${st.answered?pct+'% correct on answered questions.':'No questions answered yet.'} ${!complete?`${st.total-st.answered} questions remain; this is a partial result.`:''}</p>${historyText(active)?`<p>${historyText(active)}</p>`:''}<div class="actions">${!complete?'<button class="btn" id="resume">Continue unanswered questions</button>':''}<button class="btn ${complete?'':'secondary'}" id="review">Review answers</button><button class="btn secondary" id="restart">Start a new attempt</button></div></section>${active==='final'?`<h2>By lesson</h2><table><thead><tr><th>Lesson</th><th>Correct / answered / total</th></tr></thead><tbody>${LESSONS.map(l=>{const ids=s.ids.filter(id=>lookup[id].lesson===l.id),a=ids.filter(id=>Number.isInteger(s.answers[id])),c=a.filter(id=>s.answers[id]===lookup[id].answer);return `<tr><td>${esc(l.title)}</td><td>${c.length} / ${a.length} / ${ids.length}</td></tr>`}).join('')}</tbody></table>`:''}<h2>${missed.length?'Revisit these concepts':'Review notes'}</h2><p class="quiet">${missed.length?missed.length+' incorrect answers. Use the slide references to revise.':complete?'You answered every question correctly. You can review your answers or begin a new attempt.':'Your incorrect answers will appear here as you work.'}</p>${missed.map(id=>{const q=lookup[id];return `<div class="review-item"><h3>${esc(q.concept)}</h3><p>${esc(q.prompt)}</p><p class="quiet">Your answer: ${esc(q.options[s.answers[id]])}</p>${feedback(q,s.answers[id])}</div>`}).join('')}</div>`;
if(!complete)document.getElementById('resume').onclick=()=>{index=s.ids.findIndex(id=>!Number.isInteger(s.answers[id]));renderQuestion();window.scrollTo(0,0)};
document.getElementById('review').onclick=()=>{index=0;renderQuestion();window.scrollTo(0,0)};document.getElementById('restart').onclick=()=>{if(confirm('Start a new attempt? Your completed scores will remain in your progress history.'))start(active,true)};window.scrollTo(0,0)}
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.repeat||!active||!saved[active]||!document.getElementById('next'))return;const target=e.target;if(target instanceof Element && target.closest('button,a,input,select,textarea,summary,[contenteditable="true"]'))return;const s=saved[active],q=lookup[s.ids[index]];if(q&&s.answers[q.id]===q.answer){e.preventDefault();document.getElementById('next').click()}});
document.getElementById('home').onclick=dashboard;dashboard();const requested=new URLSearchParams(location.search).get('lesson');if(requested&&(requested==='final'||getLesson(requested)))start(requested);
</script></body></html>
